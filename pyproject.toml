[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-scan-reconstruction"
version = "1.0.1"
description = "Traceable serpentine current-scan reconstruction with an offline linked viewer"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Felix Yann"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.8"]

[project.scripts]
snake-scan = "snake_scan.cli:main"

[tool.setuptools]
packages = ["snake_scan"]

[tool.setuptools.package-data]
snake_scan = ["viewer.html"]
